<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block titulo %}Mi catálogo{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ url_for('inicio') }}">Inicio</a>
        <a href="{{ url_for('catalogo') }}">Catálogo</a>
      </nav>
    </header>

    <main>
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for categoria, mensaje in messages %}
      <div class="flash flash-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %} {% endif %} {% endwith %} {% block contenido %}{% endblock %}
    </main>

    <footer>
      <p>Catálogo de práctica con Flask</p>
    </footer>
  </body>
</html>
