{% extends "base.html" %} {% block titulo %}Editar {{ producto.nombre }}{%
endblock %} {% block contenido %}
<h1>Editar producto</h1>
<form method="POST">
  <label for="nombre">Nombre</label>
  <input
    type="text"
    id="nombre"
    name="nombre"
    value="{{ nombre }}"
    required
  />
  <label for="precio">Precio</label>
  <input
    type="number"
    id="precio"
    name="precio"
    min="1"
    value="{{ precio }}"
    required
  />
  <button type="submit">Guardar cambios</button>
</form>
<a href="{{ url_for('detalle', producto_id=producto.id) }}">← Cancelar</a>
{% endblock %}
