{% extends "base.html" %} {% block titulo %}Nuevo producto{% endblock %} {%
block contenido %}
<h1>Nuevo producto</h1>

<form method="POST">
  <label for="nombre">Nombre</label>
  <input
    type="text"
    id="nombre"
    name="nombre"
    value="{{ nombre }}"
    required
  />
  <label for="precio">Precio</label>
  <input
    type="number"
    id="precio"
    name="precio"
    min="1"
    value="{{ precio }}"
    required
  />
  <button type="submit">Guardar</button>
</form>

<a href="{{ url_for('catalogo') }}">← Volver al catálogo</a>
{% endblock %}
