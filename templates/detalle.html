{% extends "base.html" %} {% block titulo %}{{ producto.nombre }}{% endblock %}
{% block contenido %}
<h1>{{ producto.nombre }}</h1>
<p>Precio: ${{ producto.precio }}</p>
<p>
  <a href="{{ url_for('editar_producto', producto_id=producto.id) }}"
    >Editar producto</a
  >
</p>
<form
  method="POST"
  action="{{ url_for('eliminar_producto', producto_id=producto.id) }}"
  onsubmit="return confirm('¿Seguro que quieres eliminar este producto?');"
>
  <button type="submit" class="btn-danger">Eliminar producto</button>
</form>
<a href="{{ url_for('catalogo') }}">← Volver al catálogo</a>
{% endblock %}
